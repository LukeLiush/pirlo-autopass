[project]
name = "pirlo-autopass"
version = "0.1.0"
description = "Autonomous browser automation playbooks for Pirlo"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pirlo",
    "cloakbrowser>=0.5.5",
    "playwright>=1.61.0",
    "html2text>=2024.2.26",
    "browser-use>=0.13.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.uv.sources]
pirlo = { path = "../pirlo", editable = true }

[tool.ruff.lint]
ignore = [
    "BLE001",
    "S110",
]

[tool.mypy]
exclude = ["^tests/"]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
